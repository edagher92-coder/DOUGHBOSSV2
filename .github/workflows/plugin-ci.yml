name: Plugin CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PHP syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do php -l "$file"; done < <(
            find . -type d \( -name .git -o -name dist -o -name vendor -o -name node_modules \) -prune -o -type f -name '*.php' -print0
          )

      - name: PHP tests
        run: php tests/run.php

      - name: Node syntax and dependency-free tests
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(
            find . -type d \( -name .git -o -name dist -o -name vendor -o -name node_modules \) -prune -o -type f -name '*.js' -print0
          )
          while IFS= read -r -d '' file; do node --test "$file"; done < <(
            find . -type d \( -name .git -o -name dist -o -name vendor -o -name node_modules \) -prune -o -type f -name '*.test.js' -print0
          )

  archive:
    name: Build and validate plugin archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none

      - name: Build current-tree review candidate
        run: php scripts/build-zip.php

      - name: Validate archive layout
        run: php scripts/validate-zip.php dist/doughboss-review-candidate.zip

      - name: Build and validate paired theme archive
        run: |
          php scripts/build-theme-zip.php
          php scripts/validate-theme-zip.php dist/doughboss-final-review-candidate.zip
