name: Deploy read-only visual preview

on:
  push:
    branches: ["codex/visual-preview-20260908"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify current source and canonical archives
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find includes admin public themes scripts tests -type f -name '*.php' -print0)
          php -l doughboss.php
          php -l uninstall.php
          php tests/run.php
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find public themes scripts tests -type f -name '*.js' -print0)
          node --test tests/*.test.js
          php scripts/build-zip.php
          php scripts/validate-zip.php dist/doughboss-review-candidate.zip
          php scripts/build-theme-zip.php
          php scripts/validate-theme-zip.php dist/doughboss-final-review-candidate.zip
      - name: Export and validate only the public visual preview
        run: |
          php scripts/build-visual-preview.php _site /DOUGHBOSSV2/
          node scripts/validate-visual-preview.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish separate visual preview
        id: deployment
        uses: actions/deploy-pages@v4
