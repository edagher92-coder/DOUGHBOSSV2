<style>
/**
 * DoughBoss storefront styles — v2.5
 *
 * Design direction: "wood-fired, not app-store". Warm paper surfaces, charcoal
 * ink, one tomato red reserved exclusively for action, basil/oven semantics.
 *
 * Theme-survival rules baked in here (see the v2.5 audit §4.5):
 *   1. Every component selector is authored as `.db-app .x` (0,2,0) so a
 *      theme's `.entry-content button` (0,1,1) cannot win.
 *   2. NO `@layer`. An unlayered theme declaration beats *any* layered
 *      declaration regardless of specificity, and virtually every WordPress
 *      theme is unlayered — layering would hand the theme every conflict.
 *   3. `!important` appears on exactly three properties: `box-sizing`, the
 *      focus `outline`, and `font-size` on form controls (the iOS zoom floor).
 *   4. No bare `rem` anywhere — a theme running `html{font-size:62.5%}` would
 *      otherwise shrink the whole plugin. Every dimension is a px token.
 *   5. Fonts `inherit` by default; no webfont is loaded.
 *   6. Every surface declares its own background, so a dark theme cannot leave
 *      dark-on-dark text.
 */

/* ------------------------------------------------------------------ */
/* Tokens                                                             */
/* ------------------------------------------------------------------ */

.db-app {
	/* Surfaces — warm paper, never pure grey */
	--db-cream: #FBF7F0;
	--db-surface: #FFFFFF;
	--db-surface-2: #F5EFE4;

	/* Ink */
	--db-ink: #1A1614;
	--db-ink-2: #4A4038;
	--db-muted: #6F655C;

	/* Lines */
	--db-hairline: #E4DACB;
	--db-line: #9C8B78;

	/* Action — tomato. ONLY for interactive/primary. */
	--db-tomato: #C8371C;
	--db-tomato-700: #A82815;
	--db-tomato-050: #FCEBE7;

	/* Semantics */
	--db-basil: #1F6B3B;
	--db-basil-050: #E7F2E9;
	--db-oven: #8A4200;
	--db-oven-050: #FDF0E1;
	--db-danger: #8C1D18;
	--db-pending-050: #F1EADF;

	--db-focus: #1A1614;

	/* Type — inherit the theme by default; no webfont is loaded. */
	--db-font-body: inherit;
	--db-font-display: inherit;

	--db-fs-xs: 13px;
	--db-fs-sm: 14px;
	--db-fs-md: 16px;
	--db-fs-lg: 18px;
	--db-fs-xl: 22px;
	--db-fs-2xl: 28px;
	--db-fs-3xl: 36px;
	--db-lh-tight: 1.15;
	--db-lh-body: 1.55;

	/* Space */
	--db-s1: 4px;
	--db-s2: 8px;
	--db-s3: 12px;
	--db-s4: 16px;
	--db-s5: 24px;
	--db-s6: 32px;
	--db-s7: 48px;

	/* Radii */
	--db-r-sm: 8px;
	--db-r-md: 12px;
	--db-r-lg: 18px;
	--db-r-pill: 999px;

	/* Warm-tinted elevation, not the generic neutral SaaS drop */
	--db-shadow-1: 0 1px 2px rgba(26, 22, 20, .06), 0 1px 1px rgba(26, 22, 20, .04);
	--db-shadow-2: 0 2px 4px rgba(26, 22, 20, .05), 0 12px 28px -14px rgba(26, 22, 20, .22);

	/* Minimum comfortable touch target */
	--db-tap: 44px;

	font-family: var(--db-font-body);
	font-size: var(--db-fs-md);
	line-height: var(--db-lh-body);
	color: var(--db-ink);
	background: var(--db-cream);
	contain: layout style;
	isolation: isolate;
}

/* ------------------------------------------------------------------ */
/* Targeted theme reset — only what themes reliably break             */
/* ------------------------------------------------------------------ */

.db-app,
.db-app *,
.db-app *::before,
.db-app *::after {
	box-sizing: border-box !important;
}

.db-app button {
	font: inherit;
	font-size: var(--db-fs-md) !important;
	letter-spacing: normal;
	text-transform: none;
	line-height: var(--db-lh-body);
	margin: 0;
	cursor: pointer;
}

.db-app input,
.db-app textarea,
.db-app select {
	font: inherit;
	/* 16px floor: below it iOS Safari zooms the viewport on focus. */
	font-size: var(--db-fs-md) !important;
	letter-spacing: normal;
	text-transform: none;
	margin: 0;
	background: var(--db-surface);
	color: var(--db-ink);
}

.db-app ul,
.db-app ol {
	list-style: none;
	margin: 0;
	padding: 0;
}

.db-app a {
	color: var(--db-tomato-700);
	text-decoration: underline;
	text-underline-offset: 2px;
}

.db-app img {
	max-width: 100%;
	height: auto;
	border-radius: 0;
	display: block;
}

.db-app fieldset {
	border: 0;
	margin: 0;
	padding: 0;
	min-width: 0;
}

.db-app legend {
	padding: 0;
	margin: 0 0 var(--db-s2);
	float: none;
	width: auto;
}

.db-app p {
	margin: 0 0 var(--db-s3);
}

.db-app p:last-child {
	margin-bottom: 0;
}

/* Theme-proof focus indicator: dark outline + white inner ring so it reads
   on cream, on white and on the tomato button alike. */
.db-app a:focus-visible,
.db-app button:focus-visible,
.db-app input:focus-visible,
.db-app select:focus-visible,
.db-app textarea:focus-visible,
.db-app [tabindex]:focus-visible {
	outline: 3px solid var(--db-focus) !important;
	outline-offset: 2px;
	box-shadow: 0 0 0 2px #fff;
	border-radius: var(--db-r-sm);
}

/* The plugin toggles visibility with the `hidden` property. Doubling the
   attribute lifts this to (0,3,0) so it beats every component `display`
   rule below without reaching for !important. */
.db-app [hidden][hidden] {
	display: none;
}

.db-app .db-sr-only {
	position: absolute;
	width: 1px;
	height: 1px;
	padding: 0;
	margin: -1px;
	overflow: hidden;
	clip: rect(0 0 0 0);
	clip-path: inset(50%);
	white-space: nowrap;
	border: 0;
}

/* ------------------------------------------------------------------ */
/* Headings, generic text                                             */
/* ------------------------------------------------------------------ */

.db-app .db-category,
.db-app .db-builder-heading,
.db-app .db-cart-heading,
.db-app .db-checkout-heading,
.db-app .db-confirm-title,
.db-app .db-track-heading,
.db-app .db-track-title,
.db-app .db-card-title {
	font-family: var(--db-font-display);
	color: var(--db-ink);
	line-height: var(--db-lh-tight);
	margin: 0 0 var(--db-s3);
}

.db-app .db-category {
	font-size: var(--db-fs-xl);
	margin: var(--db-s6) 0 var(--db-s4);
	padding-bottom: var(--db-s2);
	border-bottom: 2px solid var(--db-hairline);
}

.db-app .db-category:first-child {
	margin-top: 0;
}

.db-app .db-loading,
.db-app .db-empty {
	padding: var(--db-s5);
	text-align: center;
	color: var(--db-muted);
	font-size: var(--db-fs-sm);
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
}

.db-app .db-error {
	color: var(--db-danger);
	font-weight: 600;
}

.db-app .db-panel {
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
	padding: var(--db-s5);
	box-shadow: var(--db-shadow-1);
}

.db-app .db-panel--error {
	border-color: var(--db-danger);
	background: var(--db-tomato-050);
}

.db-app .db-phone-line {
	font-size: var(--db-fs-sm);
	color: var(--db-ink-2);
	margin-top: var(--db-s3);
}

.db-app .db-price,
.db-app .db-total-value,
.db-app .db-option-price,
.db-app .db-line-total,
.db-app .db-builder-price-value,
.db-app .db-orderbar-total,
.db-app .db-cart-badge-total {
	font-variant-numeric: tabular-nums;
	font-feature-settings: "tnum" 1;
}

/* ------------------------------------------------------------------ */
/* Buttons                                                            */
/* ------------------------------------------------------------------ */

.db-app .db-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--db-s2);
	min-height: var(--db-tap);
	padding: var(--db-s3) var(--db-s5);
	background: var(--db-tomato);
	color: #fff;
	border: 1px solid var(--db-tomato);
	border-radius: var(--db-r-md);
	font-weight: 600;
	text-decoration: none;
	text-align: center;
	transition: background .15s ease, box-shadow .15s ease;
}

.db-app a.db-btn {
	color: #fff;
	text-decoration: none;
}

.db-app .db-btn:hover:not(:disabled) {
	background: var(--db-tomato-700);
	border-color: var(--db-tomato-700);
}

.db-app .db-btn:disabled,
.db-app .db-btn[aria-disabled="true"] {
	background: var(--db-surface-2);
	border-color: var(--db-line);
	color: var(--db-muted);
	cursor: not-allowed;
}

.db-app .db-btn--lg {
	width: 100%;
	padding: var(--db-s4) var(--db-s5);
	font-size: var(--db-fs-lg) !important;
	margin-top: var(--db-s2);
}

.db-app .db-btn--ghost {
	background: var(--db-surface);
	color: var(--db-tomato-700);
	border-color: var(--db-line);
}

.db-app a.db-btn--ghost {
	color: var(--db-tomato-700);
}

.db-app .db-btn--ghost:hover:not(:disabled) {
	background: var(--db-tomato-050);
	border-color: var(--db-tomato);
}

.db-app .db-link {
	background: none;
	border: 0;
	padding: 0;
	color: var(--db-tomato-700);
	text-decoration: underline;
	text-underline-offset: 2px;
	font-weight: 600;
	cursor: pointer;
}

/* ------------------------------------------------------------------ */
/* Closed banner                                                      */
/* ------------------------------------------------------------------ */

.db-app .db-closed {
	background: var(--db-oven-050);
	border: 1px solid var(--db-oven);
	border-radius: var(--db-r-lg);
	padding: var(--db-s4) var(--db-s5);
	margin-bottom: var(--db-s5);
	color: var(--db-oven);
}

.db-app .db-closed-title {
	display: block;
	font-size: var(--db-fs-lg);
	color: var(--db-oven);
	margin-bottom: var(--db-s1);
}

.db-app .db-closed-body {
	color: var(--db-ink-2);
	font-size: var(--db-fs-sm);
	margin-bottom: 0;
}

/* ------------------------------------------------------------------ */
/* Menu                                                               */
/* ------------------------------------------------------------------ */

.db-app .db-catnav {
	position: sticky;
	top: 0;
	z-index: 2;
	margin: 0 0 var(--db-s4);
	padding: var(--db-s2) 0;
	background: var(--db-cream);
	border-bottom: 1px solid var(--db-hairline);
	overflow-x: auto;
	overflow-y: hidden;
	-webkit-overflow-scrolling: touch;
	scrollbar-width: thin;
}

.db-app .db-catnav-list {
	display: flex;
	gap: var(--db-s2);
	margin: 0;
	padding: 0;
	list-style: none;
	min-width: max-content;
}

.db-app .db-catnav-item {
	margin: 0;
}

.db-app .db-catpill {
	display: inline-flex;
	align-items: center;
	min-height: 36px;
	padding: 0 var(--db-s4);
	background: var(--db-surface);
	color: var(--db-ink-2);
	border: 1px solid var(--db-line);
	border-radius: var(--db-r-pill);
	font-size: var(--db-fs-sm);
	font-weight: 600;
	text-decoration: none;
	white-space: nowrap;
}

.db-app .db-catpill:hover {
	background: var(--db-surface-2);
	color: var(--db-ink);
}

.db-app .db-catpill[aria-current="true"] {
	background: var(--db-tomato);
	border-color: var(--db-tomato);
	color: #fff;
}

.db-app .db-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
	gap: var(--db-s4);
}

.db-app .db-card {
	display: flex;
	flex-direction: column;
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
	overflow: hidden;
	box-shadow: var(--db-shadow-1);
	transition: box-shadow .15s ease, transform .15s ease;
	content-visibility: auto;
	contain-intrinsic-size: 0 280px;
}

.db-app .db-card:hover {
	box-shadow: var(--db-shadow-2);
}

.db-app .db-card--unavailable,
.db-app .db-card--soldout {
	opacity: .82;
}

.db-app .db-card-media {
	position: relative;
	background: var(--db-surface-2);
	aspect-ratio: 4 / 3;
	overflow: hidden;
}

.db-app .db-card-img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	background: var(--db-surface-2);
}

/* A warm, flat "not photographed yet" tile — deliberately not a diagonal
   stripe, which reads as a broken image. */
.db-app .db-card-img--placeholder {
	background: var(--db-surface-2);
	position: relative;
}

.db-app .db-card-img--placeholder::after {
	content: "";
	position: absolute;
	left: 50%;
	top: 50%;
	width: 56px;
	height: 56px;
	transform: translate(-50%, -50%);
	border: 2px solid var(--db-hairline);
	border-radius: 50%;
	box-shadow: inset 0 0 0 6px var(--db-surface-2), inset 0 0 0 8px var(--db-hairline);
}

.db-app .db-badge {
	display: inline-block;
	border-radius: var(--db-r-pill);
	padding: var(--db-s1) var(--db-s3);
	font-size: var(--db-fs-xs);
	font-weight: 700;
	background: var(--db-pending-050);
	color: var(--db-ink);
}

.db-app .db-badge--soldout {
	position: absolute;
	top: var(--db-s3);
	left: var(--db-s3);
	background: var(--db-ink);
	color: #fff;
}

.db-app .db-cart-line .db-badge--soldout {
	position: static;
	margin-top: var(--db-s1);
	align-self: flex-start;
}

.db-app .db-card-body {
	display: flex;
	flex-direction: column;
	flex: 1;
	gap: var(--db-s2);
	padding: var(--db-s4);
	background: var(--db-surface);
}

.db-app .db-card-title {
	font-size: var(--db-fs-lg);
	margin: 0;
}

.db-app .db-card-desc {
	color: var(--db-muted);
	font-size: var(--db-fs-sm);
	margin: 0;
	flex: 1;
}

.db-app .db-card-note {
	color: var(--db-danger);
	font-size: var(--db-fs-xs);
	margin: 0;
	font-weight: 600;
}

.db-app .db-card-foot {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--db-s3);
	margin-top: var(--db-s2);
}

.db-app .db-price {
	font-family: var(--db-font-display);
	font-size: var(--db-fs-lg);
	font-weight: 700;
	color: var(--db-ink);
}

/* ------------------------------------------------------------------ */
/* Builder                                                            */
/* ------------------------------------------------------------------ */

.db-app .db-builder-inner {
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
	padding: var(--db-s5);
	max-width: 620px;
	box-shadow: var(--db-shadow-1);
}

.db-app .db-builder-heading {
	font-size: var(--db-fs-xl);
}

.db-app .db-fieldset {
	margin-bottom: var(--db-s5);
	background: var(--db-surface);
}

.db-app .db-legend {
	font-size: var(--db-fs-sm);
	font-weight: 700;
	letter-spacing: .04em;
	text-transform: uppercase;
	color: var(--db-ink-2);
}

.db-app .db-options {
	display: flex;
	flex-direction: column;
	gap: var(--db-s2);
}

.db-app .db-options--inline {
	flex-direction: row;
	flex-wrap: wrap;
}

.db-app .db-option {
	display: flex;
	align-items: center;
	gap: var(--db-s3);
	min-height: var(--db-tap);
	padding: var(--db-s2) var(--db-s3);
	background: var(--db-surface);
	border: 1px solid var(--db-line);
	border-radius: var(--db-r-sm);
	cursor: pointer;
	transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
}

.db-app .db-options--inline .db-option {
	flex: 1 1 160px;
}

.db-app .db-option:hover {
	background: var(--db-surface-2);
}

/* Selectable-card treatment. The native control stays visible on purpose. */
.db-app .db-option:has(:checked) {
	background: var(--db-tomato-050);
	border-color: var(--db-tomato);
	box-shadow: inset 0 0 0 1px var(--db-tomato);
}

.db-app .db-option-input {
	width: 18px;
	height: 18px;
	flex: 0 0 auto;
	accent-color: var(--db-tomato);
}

.db-app .db-option-label {
	flex: 1;
}

.db-app .db-option-price {
	color: var(--db-muted);
	font-size: var(--db-fs-sm);
}

.db-app .db-builder-foot {
	display: flex;
	align-items: center;
	gap: var(--db-s4);
	padding-top: var(--db-s4);
	border-top: 1px solid var(--db-hairline);
	background: var(--db-surface);
}

.db-app .db-builder-price {
	display: block;
	font-family: var(--db-font-display);
	font-size: var(--db-fs-2xl);
	font-weight: 800;
	line-height: var(--db-lh-tight);
	color: var(--db-ink);
}

.db-app .db-builder-foot .db-btn--lg {
	margin-top: 0;
	width: auto;
	flex: 1;
}

/* ------------------------------------------------------------------ */
/* Cart                                                               */
/* ------------------------------------------------------------------ */

.db-app .db-cart-inner {
	background: var(--db-cream);
}

.db-app .db-cart-heading {
	font-size: var(--db-fs-xl);
}

.db-app .db-empty-cart {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--db-s4);
	padding: var(--db-s6) var(--db-s5);
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
}

.db-app .db-empty-cart .db-empty {
	border: 0;
	padding: 0;
	background: transparent;
}

.db-app .db-recent {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--db-s2) var(--db-s3);
	padding: var(--db-s3) var(--db-s4);
	margin-bottom: var(--db-s4);
	background: var(--db-surface-2);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-md);
	font-size: var(--db-fs-sm);
}

.db-app .db-recent-number {
	font-variant-numeric: tabular-nums;
	font-weight: 700;
}

.db-app .db-cart-lines {
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
	overflow: hidden;
}

.db-app .db-cart-line {
	display: flex;
	align-items: center;
	gap: var(--db-s4);
	padding: var(--db-s4);
	background: var(--db-surface);
	border-bottom: 1px solid var(--db-hairline);
}

.db-app .db-cart-line:last-child {
	border-bottom: 0;
}

.db-app .db-cart-line--unavailable {
	background: var(--db-surface-2);
}

.db-app .db-cart-line-info {
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	gap: var(--db-s1);
	min-width: 0;
}

.db-app .db-line-name {
	font-weight: 700;
}

.db-app .db-line-sub {
	color: var(--db-muted);
	font-size: var(--db-fs-sm);
}

.db-app .db-line-controls {
	display: flex;
	align-items: center;
	gap: var(--db-s4);
	flex: 0 0 auto;
}

.db-app .db-qty-wrap {
	display: flex;
	align-items: center;
	border: 1px solid var(--db-line);
	border-radius: var(--db-r-sm);
	background: var(--db-surface);
	overflow: hidden;
}

.db-app .db-step {
	width: var(--db-tap);
	min-height: var(--db-tap);
	background: var(--db-surface);
	border: 0;
	color: var(--db-ink);
	font-size: var(--db-fs-lg) !important;
	font-weight: 700;
	line-height: 1;
}

.db-app .db-step:hover {
	background: var(--db-surface-2);
}

.db-app .db-qty {
	width: 56px;
	min-height: var(--db-tap);
	padding: var(--db-s2) var(--db-s1);
	text-align: center;
	border: 0;
	border-left: 1px solid var(--db-hairline);
	border-right: 1px solid var(--db-hairline);
	border-radius: 0;
	background: var(--db-surface);
	font-variant-numeric: tabular-nums;
}

.db-app .db-line-total {
	min-width: 72px;
	text-align: right;
}

.db-app .db-edit,
.db-app .db-remove {
	min-height: var(--db-tap);
	min-width: var(--db-tap);
	padding: 0 var(--db-s3);
	background: var(--db-surface);
	border: 1px solid var(--db-line);
	border-radius: var(--db-r-sm);
	color: var(--db-danger);
	font-size: var(--db-fs-sm) !important;
	font-weight: 600;
}

.db-app .db-remove:hover {
	background: var(--db-tomato-050);

/* ------------------------------------------------------------------ */

.db-app .db-checkout {

	margin-top: var(--db-s5);

.db-app .db-checkout-heading {

}

.db-app .db-label {

}

.db-app .db-input {

.db-app .db-field-error {

}

.db-app .db-due-line {
	margin: 0;
	font-weight: 700;

}

.db-app .db-pay-note {
	margin: 0;
	color: var(--db-muted);
	font-size: var(--db-fs-sm);
	text-align: center;
}

.db-app .db-checkout-msg {
	min-height: 20px;
	font-size: var(--db-fs-sm);
}

/* ------------------------------------------------------------------ */
/* Sticky order bar (mobile)                                          */
/* ------------------------------------------------------------------ */

.db-app .db-orderbar {
	display: none;
}

/* ------------------------------------------------------------------ */
/* Receipt                                                            */
/* ------------------------------------------------------------------ */

.db-app .db-confirm {
	background: var(--db-surface);
	border: 2px solid var(--db-basil);
	border-radius: var(--db-r-lg);

	box-shadow: var(--db-shadow-1);
}

.db-app .db-confirm-title {
	font-size: var(--db-fs-2xl);

}

.db-app .db-confirm-number {

}

.db-app .db-confirm-number strong {

}

.db-app .db-item-list {
	margin: var(--db-s4) 0;
	padding: 0;
	border-top: 1px solid var(--db-hairline);
}

.db-app .db-item-row {
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	justify-content: space-between;

	padding: var(--db-s3) 0;

.db-app .db-item-name {
	font-weight: 600;
}

.db-app .db-item-sub {

.db-app .db-totals--receipt {

.db-app .db-confirm-email,
.db-app .db-confirm-track {
	margin-top: var(--db-s4);
}

.db-app .db-print {
	margin-top: var(--db-s4);
}

/* ------------------------------------------------------------------ */
/* Tracking                                                           */
/* ------------------------------------------------------------------ */

.db-app .db-track-form {
	display: flex;
	flex-direction: column;
	gap: var(--db-s3);
	max-width: 420px;
	padding: var(--db-s5);
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);
	border-radius: var(--db-r-lg);
}

.db-app .db-track-form input {
	width: 100%;
	min-height: var(--db-tap);
	padding: var(--db-s3);
	background: var(--db-surface);
	color: var(--db-ink);
	border: 1px solid var(--db-line);
	border-radius: var(--db-r-sm);
}

.db-app .db-track-heading {
	font-size: var(--db-fs-lg);
	margin: 0;
}

.db-app .db-track-card {
	max-width: 420px;
	margin-top: var(--db-s4);
	padding: var(--db-s5);
	background: var(--db-surface);
	border: 1px solid var(--db-hairline);

.db-app .db-track-title {
	font-size: var(--db-fs-lg);

/* Status pills — tint + text, never colour alone. */
.db-app .db-pill {
	display: inline-block;
	padding: var(--db-s1) var(--db-s4);
	border-radius: var(--db-r-pill);

	font-weight: 700;

	color: var(--db-ink);
}

.db-app .db-pill--pending {
	background: var(--db-pending-050);
	color: var(--db-ink);
}

.db-app .db-pill--preparing {
	background: var(--db-oven-050);
	color: var(--db-oven);
}

.db-app .db-pill--ready {
	background: var(--db-basil-050);
	color: var(--db-basil);
}

.db-app .db-pill--cancelled {
	background: var(--db-tomato-050);
	color: var(--db-danger);
}

/* ------------------------------------------------------------------ */
/* Cart badge                                                         */
/* ------------------------------------------------------------------ */

.db-app.db-cart-badge {
	display: inline-flex;
	align-items: center;
	gap: var(--db-s2);
	min-height: var(--db-tap);
	padding: var(--db-s2) var(--db-s4);
	background: var(--db-tomato);
	color: #fff;
	border: 1px solid var(--db-tomato);
	border-radius: var(--db-r-pill);
	text-decoration: none;
	font-weight: 700;
	contain: none;
}

.db-app.db-cart-badge:hover {
	background: var(--db-tomato-700);
	color: #fff;
}

.db-app .db-cart-badge-count {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 24px;
	height: 24px;
	padding: 0 var(--db-s1);
	background: #fff;
	color: var(--db-tomato-700);
	border-radius: var(--db-r-pill);
	font-size: var(--db-fs-sm);

}

}

.db-app.db-cart-badge--empty {

}

	background: var(--db-surface-2);
	color: var(--db-ink-2);
}

/* ------------------------------------------------------------------ */
/* Toasts                                                             */
/* ------------------------------------------------------------------ */

.db-app.db-toasts {
	position: fixed;
	left: 50%;
	bottom: max(16px, env(safe-area-inset-bottom));
	transform: translateX(-50%);
	z-index: 99999;
	display: flex;
	flex-direction: column;
	gap: var(--db-s2);
	width: min(420px, calc(100vw - 32px));
	background: transparent;
	pointer-events: none;
	contain: none;
}

.db-app .db-toast {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--db-s4);
	padding: var(--db-s3) var(--db-s4);
	background: var(--db-ink);
	color: #fff;
	border-radius: var(--db-r-md);
	box-shadow: var(--db-shadow-2);
	font-size: var(--db-fs-sm);
	pointer-events: auto;
}

.db-app .db-toast--error {

}

.db-app .db-toast-action {
	flex: 0 0 auto;
	min-height: 36px;
	padding: var(--db-s1) var(--db-s3);
	background: #fff;
	color: var(--db-ink);
	border: 0;
	border-radius: var(--db-r-sm);
	font-size: var(--db-fs-sm) !important;
	font-weight: 700;
}

/* ------------------------------------------------------------------ */
/* Mobile                                                             */
/* ------------------------------------------------------------------ */

@media (max-width: 768px) {
	/* Keep the running price and the Add button on screen while the
	   customer works through a long topping list. */
	.db-app .db-builder-foot {
		position: sticky;
		bottom: 0;
		z-index: 2;
		margin: 0 calc(var(--db-s5) * -1) calc(var(--db-s5) * -1);
		padding: var(--db-s3) var(--db-s5);
		padding-bottom: max(var(--db-s3), env(safe-area-inset-bottom));
		background: var(--db-surface);
		border-top: 1px solid var(--db-hairline);
		box-shadow: 0 -12px 28px -18px rgba(26, 22, 20, .35);
	}

	.db-app .db-builder-price {
		font-size: var(--db-fs-xl);
	}

	.db-app .db-orderbar {
		position: sticky;
		bottom: 0;
		z-index: 3;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: var(--db-s4);
		min-height: 56px;
		margin-top: var(--db-s5);
		padding: var(--db-s3) var(--db-s4);
		padding-bottom: max(var(--db-s3), env(safe-area-inset-bottom));
		background: var(--db-cream);
		border-top: 1px solid var(--db-hairline);
		box-shadow: 0 -12px 28px -18px rgba(26, 22, 20, .35);
	}

	.db-app .db-orderbar[hidden] {
		display: none;
	}

	.db-app .db-orderbar-info {
		display: flex;
		flex-direction: column;
		line-height: var(--db-lh-tight);
	}

	.db-app .db-orderbar-label {
		font-size: var(--db-fs-xs);
		color: var(--db-muted);
	}

	.db-app .db-orderbar-total {
		font-family: var(--db-font-display);
		font-size: var(--db-fs-xl);
	}

	.db-app .db-orderbar-btn {
		flex: 0 0 auto;
	}

	/* Clear the sticky order bar so a toast never sits on the CTA. */
	.db-app.db-toasts {
		bottom: max(76px, calc(env(safe-area-inset-bottom) + 68px));
	}
}

@media (max-width: 560px) {
	.db-app .db-cart-line {
		flex-wrap: wrap;
		gap: var(--db-s3);
		padding: var(--db-s3);
	}

	.db-app .db-cart-line-info {
		flex: 1 1 100%;
	}

	/* Row two: stepper, price, Remove — all still >= 44px, and the row must
	   fit 390px without the container's overflow clipping Remove. */
	.db-app .db-line-controls {
		flex: 1 1 100%;
		flex-wrap: wrap;
		justify-content: space-between;
		gap: var(--db-s2);
	}

	.db-app .db-qty {
		width: 48px;
	}

	.db-app .db-line-total {
		min-width: 0;
	}

	.db-app .db-remove {
		padding: 0 var(--db-s2);
	}

	.db-app .db-grid {
		grid-template-columns: 1fr;
	}

	.db-app .db-builder-inner {
		padding: var(--db-s4);
	}

	.db-app .db-checkout {
		padding: var(--db-s4);
	}

	.db-app .db-options--inline {
		flex-direction: column;
	}

	/* Stacked: the 160px basis would become a 160px-tall row. */
	.db-app .db-options--inline .db-option {
		flex: 0 0 auto;
	}
}

@media (prefers-reduced-motion: reduce) {
	.db-app *,
	.db-app *::before,
	.db-app *::after {
		transition: none;
		animation: none;
		scroll-behavior: auto;
	}
}

/* ------------------------------------------------------------------ */
/* Print — the customer's receipt is the only thing worth ink         */
/* ------------------------------------------------------------------ */

@media print {
	.db-app .db-toasts,
	.db-app .db-orderbar,
	.db-app .db-print,
	.db-app .db-cart-badge {
		display: none;
	}

	.db-app {
		background: #fff;
		color: #000;
		contain: none;
	}

	.db-app .db-confirm {
		border: 1px solid #000;
		box-shadow: none;
		padding: 0;
	}

	.db-app .db-confirm-title {
		color: #000;
		font-size: 20px;
	}

	.db-app .db-item-row,
	.db-app .db-totals--receipt {
		background: #fff;
	}

	.db-app .db-link {
		color: #000;
		text-decoration: underline;
	}
}

</style>

<body>
<div class="harness-section"><h1>Cart badge</h1><a class="db-app db-cart-badge" data-doughboss-cart-badge href="/cart/" hidden><span class="db-cart-badge-icon" aria-hidden="true">🛒</span><span class="db-cart-badge-count"></span><span class="db-cart-badge-total"></span><span class="db-cart-badge-label">View cart</span></a></div>
<div class="harness-section"><h1>Menu</h1><div class="db-app" data-doughboss-menu><div class="db-loading">Loading…</div></div></div>
<div class="harness-section"><h1>Builder</h1><div class="db-app" data-doughboss-builder><div class="db-loading">Loading…</div></div></div>
<div class="harness-section"><h1>Cart</h1><div class="db-app" data-doughboss-cart><div class="db-loading">Loading…</div></div></div>
<div class="harness-section"><h1>Tracking</h1><div class="db-app db-tracking" data-doughboss-tracking data-heading-level="2"><form class="db-track-form"><h2 class="db-track-heading">Track your order</h2><div class="db-field"><label class="db-label" for="db-track-number">Order number</label><input class="db-input" type="text" id="db-track-number" name="number" required autocomplete="off" autocapitalize="characters" enterkeyhint="next" /></div><div class="db-field"><label class="db-label" for="db-track-email">Email</label><input class="db-input" type="email" id="db-track-email" name="email" required autocomplete="email" inputmode="email" enterkeyhint="go" /></div><button type="submit" class="db-btn db-btn--lg">Find my order</button></form><div class="db-track-result" aria-live="polite"></div></div></div>
<script>

(function () {
	var params = new URLSearchParams(location.search);
	var CLOSED = params.get('closed') === '1';

	var CONFIG = {
		currency_symbol: '$',
		currency_code: 'AUD',
		tax_rate: 10,
		tax_label: 'GST',
		tax_inclusive: true,
		delivery_fee: 5,
		min_order: 0,
		enable_pickup: true,
		enable_delivery: true,
		ordering_open: !CLOSED,
		sizes: [
			{ slug: 'small', label: 'Small (10")', price: 12 },
			{ slug: 'medium', label: 'Medium (13")', price: 16 },
			{ slug: 'large', label: 'Large (16")', price: 20 }
		],
		toppings: [
			{ slug: 'pepperoni', label: 'Pepperoni', price: 3 },
			{ slug: 'mushrooms', label: 'Mushrooms', price: 2.5 },
			{ slug: 'olives', label: 'Olives', price: 2 },
			{ slug: 'extra-cheese', label: 'Extra cheese', price: 3.5 },
			{ slug: 'basil', label: 'Fresh basil', price: 1.5 }
		],
		pay_note: 'No payment now — pay when you collect.',
		store_phone: '0400 000 000'
	};

	window.DoughBossData = {
		restUrl: '/wp-json/doughboss/v1',
		nonce: 'test-nonce-1',
		currency: '$',
		i18n: {},
		config: CONFIG,
		storePhone: '0400 000 000',
		headingLevel: 2,
		menuUrl: '/order-online/',
		trackingUrl: '/track-order/'
	};

	var MENU = [
		{ id: 101, name: 'Margherita', description: 'San Marzano, fior di latte, basil.', price: 18, type: 'menu', image: '', srcset: '', image_width: 800, image_height: 600, category: 'Pizzas', available: true },
		{ id: 102, name: 'Diavola', description: 'Spicy salami, chilli, mozzarella.', price: 22, type: 'menu', image: '', srcset: '', image_width: 800, image_height: 600, category: 'Pizzas', available: true },
		{ id: 103, name: 'Garlic bread', description: 'Wood-fired, garlic butter.', price: 8, type: 'menu', image: '', srcset: '', image_width: 800, image_height: 600, category: 'Sides', available: true },
		{ id: 104, name: 'Nonna\'s cannoli', description: 'Sold out today.', price: 6, type: 'menu', image: '', srcset: '', image_width: 800, image_height: 600, category: 'Sides', available: false }
	];

	var ITEMS = [];
	var keySeq = 0;

	function round(n) { return Math.round(n * 100) / 100; }

	function totalsFor(orderType) {
		var subtotal = 0;
		var count = 0;
		ITEMS.forEach(function (l) { subtotal += l.line_total; count += l.quantity; });
		subtotal = round(subtotal);
		var deliveryFee = (orderType === 'delivery' && ITEMS.length) ? CONFIG.delivery_fee : 0;
		var tax = round(subtotal * CONFIG.tax_rate / (100 + CONFIG.tax_rate));
		var total = round(subtotal + deliveryFee);
		return {
			subtotal: subtotal,
			tax: tax,
			delivery_fee: deliveryFee,
			total: total,
			item_count: count,
			tax_inclusive: true,
			tax_label: CONFIG.tax_label,
			tax_rate: CONFIG.tax_rate,
			min_order: CONFIG.min_order,
			min_order_met: CONFIG.min_order <= 0 || subtotal >= CONFIG.min_order
		};
	}

	function cartObject(orderType) {
		return { items: ITEMS.map(function (l) { return l; }), totals: totalsFor(orderType) };
	}

	function json(body, status) {
		return new Response(JSON.stringify(body), {
			status: status || 200,
			headers: { 'Content-Type': 'application/json' }
		});
	}

	function addLine(body) {
		var line;
		if (body.type === 'custom') {
			var size = CONFIG.sizes.filter(function (s) { return s.slug === body.size; })[0] || CONFIG.sizes[0];
			var tops = (body.toppings || []).map(function (slug) {
				return CONFIG.toppings.filter(function (tp) { return tp.slug === slug; })[0];
			}).filter(Boolean);
			var unit = size.price + tops.reduce(function (a, tp) { return a + tp.price; }, 0);
			keySeq++;
			line = {
				key: 'c' + keySeq,
				type: 'custom',
				item_id: 0,
				name: 'Custom Pizza',
				size: size.label,
				size_slug: size.slug,
				toppings: tops,
				unit_price: round(unit),
				quantity: body.quantity || 1,
				line_total: round(unit * (body.quantity || 1)),
				available: true
			};
			ITEMS.push(line);
			return line;
		}

		var item = MENU.filter(function (m) { return m.id === Number(body.item_id); })[0];
		if (!item) { return null; }
		var existing = ITEMS.filter(function (l) { return l.type === 'menu' && l.item_id === item.id; })[0];
		if (existing) {
			existing.quantity += (body.quantity || 1);
			existing.line_total = round(existing.unit_price * existing.quantity);
			return existing;
		}
		keySeq++;
		line = {
			key: 'm' + keySeq,
			type: 'menu',
			item_id: item.id,
			name: item.name,
			size: '',
			toppings: [],
			unit_price: item.price,
			quantity: body.quantity || 1,
			line_total: round(item.price * (body.quantity || 1)),
			available: true
		};
		ITEMS.push(line);
		return line;
	}

	window.__dbRequests = [];

	window.fetch = function (url, opts) {
		opts = opts || {};
		var u = String(url);
		var qs = u.indexOf('?') === -1 ? '' : u.slice(u.indexOf('?') + 1);
		var pathOnly = u.split('?')[0].replace('/wp-json/doughboss/v1', '');
		var body = opts.body ? JSON.parse(opts.body) : {};
		var orderType = /order_type=delivery/.test(qs) ? 'delivery' : 'pickup';
		window.__dbRequests.push((opts.method || 'GET') + ' ' + u);

		return new Promise(function (resolve) {
			setTimeout(function () {
				if (pathOnly === '/config') { return resolve(json(CONFIG)); }
				if (pathOnly === '/nonce') { return resolve(json({ nonce: 'test-nonce-2' })); }
				if (pathOnly === '/menu') { return resolve(json(MENU)); }
				if (pathOnly === '/cart') { return resolve(json(cartObject(orderType))); }

				if (pathOnly === '/cart/add') {
					if (!CONFIG.ordering_open) {
						return resolve(json({ code: 'doughboss_closed', message: 'Online ordering is currently closed.', data: { status: 403 } }, 403));
					}
					var added = addLine(body);
					if (!added) { return resolve(json({ code: 'doughboss_not_found', message: 'Item not found.', data: { status: 404 } }, 404)); }
					var out = cartObject(body.order_type || 'pickup');
					out.added = added;
					return resolve(json(out));
				}

				if (pathOnly === '/cart/update') {
					ITEMS.forEach(function (l) {
						if (l.key === body.key) {
							l.quantity = body.quantity;
							l.line_total = round(l.unit_price * l.quantity);
						}
					});
					if (body.quantity <= 0) {
						ITEMS = ITEMS.filter(function (l) { return l.key !== body.key; });
					}
					return resolve(json(cartObject(body.order_type || 'pickup')));
				}

				if (pathOnly === '/cart/remove') {
					ITEMS = ITEMS.filter(function (l) { return l.key !== body.key; });
					return resolve(json(cartObject(body.order_type || 'pickup')));
				}

				if (pathOnly === '/cart/clear') {
					ITEMS = [];
					return resolve(json(cartObject('pickup')));
				}

				if (pathOnly === '/checkout') {
					if (!CONFIG.ordering_open) {
						return resolve(json({ code: 'doughboss_closed', message: 'Online ordering is currently closed.', data: { status: 403 } }, 403));
					}
					if (!ITEMS.length) {
						return resolve(json({ code: 'doughboss_cart_expired', message: 'Your cart is empty.', data: { status: 400 } }, 400));
					}
					var t = totalsFor(body.order_type);
					ITEMS = [];
					return resolve(json({
						success: true,
						order_number: 'DB-260906-A7K2',
						total: t.total,
						message: 'Thanks! Your order has been received.',
						email_sent: true,
						tracking_url: '/track-order/?number=DB-260906-A7K2'
					}));
				}

				if (pathOnly === '/order/track') {
					return resolve(json({
						order_number: body.number,
						status: 'preparing',
						status_label: 'In the oven',
						order_type: 'pickup',
						total: 26,
						currency: 'AUD',
						created_at: '2026-09-06T18:00:00+10:00',
						items: [{ name: 'Margherita', quantity: 1, size: '', toppings: [], line_total: 18 }]
					}));
				}

				resolve(json({ code: 'rest_no_route', message: 'No route.', data: { status: 404 } }, 404));
			}, 10);
		});
	};
}());
